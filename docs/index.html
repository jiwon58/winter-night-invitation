<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta property="og:title" content="겨울밤 초대장">
<meta property="og:description" content="너와 보내고 싶은 크리스마스 저녁">
<title>겨울밤 초대장</title>
<style>
:root{
  color-scheme:dark;
  --ink:#f7eedf;
  --gold:#e9c993;
  --settle:cubic-bezier(.22,1,.36,1);
  --panel-radius:24px;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100svh;
  padding:clamp(16px,4vw,32px);
  display:grid;
  place-items:center;
  background:radial-gradient(ellipse at 50% 0%,#242c47 0%,transparent 63%),
    radial-gradient(ellipse at 35% 95%,#272133 0%,transparent 55%),#0d1324;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
main{width:min(100%,540px);min-width:0}
section{
  padding:clamp(22px,6vw,52px);
  border:1px solid #baa17a3d;
  border-radius:var(--panel-radius);
  background:linear-gradient(155deg,#1f2841,#171d32);
  box-shadow:0 24px 64px #04071366,inset 0 1px #ffffff09;
}
#cover{
  text-align:center;
  background:radial-gradient(ellipse at 50% 44%,#3a3248,transparent 72%),linear-gradient(155deg,#222a43,#171d32);
}
h1,h2{font-family:'Noto Serif KR','Nanum Myeongjo',Georgia,serif;word-break:keep-all;line-height:1.45;font-weight:500;margin:10px 0 24px}
h1{font-size:clamp(27px,6vw,43px);letter-spacing:-.025em}
p{line-height:1.8}
.snow{color:var(--gold);letter-spacing:.55em;font-size:.9rem}
.envelope{
  position:relative;
  margin:38px auto 32px;
  width:min(228px,100%);
  height:138px;
  perspective:600px;
  background:linear-gradient(#424d70,#333c59);
  border:1px solid #dcc49e66;
  border-radius:7px;
  box-shadow:0 12px 30px #080a1973;
}
.envelope::before,.flap{
  position:absolute;
  inset:0;
  content:"";
  background:linear-gradient(155deg,#343e5d,#2a334e);
  clip-path:polygon(0 0,50% 61%,100% 0,100% 100%,0 100%);
  border-radius:inherit;
}
.flap{
  background:linear-gradient(155deg,#53607f,#3b4566 75%);
  clip-path:polygon(0 0,100% 0,50% 64%);
  transform-origin:top;
}
.seal{
  position:absolute;
  top:63%;
  left:53%;
  transform:translate(-50%,-50%);
  width:58px;
  height:auto;
  filter:drop-shadow(0 4px 5px #06091285);
}
.dried-flower{position:relative;display:block;width:153px;height:auto;pointer-events:none;z-index:1}
.envelope .dried-flower{
  position:absolute;
  width:141px;
  top:63%;
  left:53%;
  transform:translate(-68%,-62%);
  filter:drop-shadow(0 3px 3px #10091172);
}
.letter-flower{margin:-9px auto 4px;width:max-content}
.letter-flower .dried-flower{filter:drop-shadow(0 2px 2px #6c493428)}
.unsealed .seal{animation:release 430ms var(--settle) both}
.unsealed .flap{animation:unfold 470ms var(--settle) both}
@keyframes release{
  to{transform:translate(-35%,-18%) rotate(12deg) scale(.87);opacity:0}
}
@keyframes unfold{
  to{transform:rotateX(29deg);opacity:.72}
}
.opening .dried-flower{view-transition-name:pressed-flower}
::view-transition{pointer-events:none}
html.opening::view-transition-old(root){animation:fade-out 320ms ease-out both}
html.opening::view-transition-new(root){animation:fade-in 530ms var(--settle) both}
html.opening::view-transition-group(pressed-flower){animation-duration:650ms;animation-timing-function:var(--settle)}
html.opening::view-transition-old(pressed-flower){animation:fade-out 530ms var(--settle) both}
html.opening::view-transition-new(pressed-flower){animation:fade-in 530ms var(--settle) both}
@keyframes fade-out{to{opacity:0}}
@keyframes fade-in{from{opacity:0}}
@keyframes panel-in{from{opacity:0;transform:translateY(8px)}}
.panel-in{animation:panel-in 330ms var(--settle) both}
form{display:grid;gap:10px}
input,button,textarea{font:inherit}
input[type=password],textarea{
  width:100%;
  border:1px solid #e9c9934a;
  border-radius:12px;
  background:#10172a9e;
  color:var(--ink);
  padding:12px;
  text-align:center;
}
input[type=password]:focus,textarea:focus{outline:2px solid #e9c9939c;outline-offset:2px}
button{
  min-height:46px;
  border:0;
  border-radius:12px;
  padding:10px 16px;
  background:linear-gradient(#efd5ac,#e4bc82);
  color:#261b16;
  font-weight:650;
  cursor:pointer;
  transition:opacity 150ms ease,transform 180ms var(--settle);
}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.55;cursor:default}
button.secondary{background:transparent;border:1px solid #e9c9934a;color:var(--ink);margin-top:12px}
[hidden]{display:none!important}
.feedback{margin:0;color:#ffd4b5}
.paper{background:linear-gradient(155deg,#fff9ed,#f6ead7);border-color:#fff4e4;color:#322824;color-scheme:light}
.letter-copy{white-space:pre-wrap;overflow-wrap:anywhere}
#signature{text-align:right;white-space:pre-wrap}
.alley-route{position:relative;padding-left:22px}
.alley-route::before{
  content:"";
  position:absolute;
  top:15px;
  bottom:18px;
  left:4px;
  width:2px;
  background:repeating-linear-gradient(to bottom,#e9c993a0 0 5px,transparent 5px 11px);
}
.route-stop{position:relative;scroll-margin-top:20px}
.route-stop::before{
  content:"";
  position:absolute;
  left:-22px;
  top:12px;
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 0 4px #d9af6c30;
}
.route-label{margin:0 0 9px;color:var(--gold);font-size:.92rem;font-weight:650;letter-spacing:.015em}
.alley-walk{
  position:relative;
  display:block;
  min-height:clamp(230px,68vw,350px);
  margin:18px 0 22px;
  width:100%;
  padding:0;
  border:1px solid #ead3aa38;
  border-radius:16px;
  background:url("./images/hannam-evening-alley.webp") center 57% / cover,#212a42;
}
.alley-walk::before{
  content:"";
  position:absolute;
  left:-18px;
  top:calc(50% - 5px);
  width:4px;
  height:10px;
  border-radius:6px;
  background:var(--gold);
  box-shadow:0 0 10px 2px #ecc27a58;
}
.alley-walk:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.alley-next{margin:-8px 0 22px}
.alley-next .secondary{margin:0}
#postscript{padding:0;border:0;background:transparent;box-shadow:none;perspective:900px}
.postscript-paper{
  position:relative;
  padding:clamp(24px,6vw,46px);
  border:1px solid #fff4e4;
  border-radius:16px;
  color:#322824;
  background:linear-gradient(165deg,#fff9ed 0%,#fff6e6 48%,#eddec7 50%,#fbf0db 52%,#f6ead7 100%);
  box-shadow:0 22px 60px #05081168;
  transform-origin:50% 0;
}
#postscript:not([hidden]) .postscript-paper{animation:unfold-note 780ms var(--settle) both}
#postscript:not([hidden]) .letter-copy{animation:fade-in 420ms 230ms ease-out both}
.postscript-paper h2{margin-bottom:17px}
.postscript-paper p{margin:0}
@keyframes unfold-note{
  0%{opacity:.52;transform:translateY(20px) rotateX(-61deg) scaleY(.28);clip-path:inset(0 0 68% 0 round 16px)}
  48%{opacity:1;transform:translateY(3px) rotateX(-19deg) scaleY(.78);clip-path:inset(0 0 21% 0 round 16px)}
  100%{opacity:1;transform:translateY(0) rotateX(0) scaleY(1);clip-path:inset(0 0 0 0 round 16px)}
}
.itinerary-stop{border:1px solid #ead3aa40;border-radius:16px;overflow:hidden;background:#222d45}
.itinerary-image{aspect-ratio:16/10;margin:0;background:#182135}
.itinerary-image img{display:block;width:100%;height:100%;object-fit:cover}
.itinerary-info{padding:clamp(14px,4vw,22px)}
.itinerary-name{margin:0 0 8px;font-size:clamp(1.22rem,4.5vw,1.55rem);line-height:1.4;word-break:keep-all}
.itinerary-address{margin:0;color:#ebd6b2;font-style:normal;line-height:1.55;overflow-wrap:anywhere}
.itinerary-info p{margin:12px 0}
.itinerary-map{display:inline-flex;align-items:center;min-height:44px;padding:6px 12px;border:1px solid #978260;border-radius:10px;color:var(--ink);text-underline-offset:3px}
.itinerary-credit{display:inline-block;margin:8px 0 0 3px;color:#e7d8bf;font-size:.8rem;text-underline-offset:3px}
.itinerary-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.itinerary-actions .secondary{margin-top:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.letter-copy .heart-button{
  display:inline-block;
  vertical-align:baseline;
  min-height:0;
  margin:-5px 0;
  padding:5px 4px;
  border-radius:8px;
  background:transparent;
  line-height:inherit;
}
.heart-button:focus-visible{outline:2px solid #8b4a57;outline-offset:1px}
.heart-rain{position:fixed;inset:0;z-index:5;overflow:hidden;pointer-events:none}
.heart-drop{
  position:absolute;
  top:-56px;
  left:var(--left);
  font-size:var(--size);
  line-height:1;
  opacity:0;
  filter:drop-shadow(0 1px 2px #1b132872);
  animation:heart-fall var(--duration) var(--delay) cubic-bezier(.31,.12,.58,1) both;
}
@keyframes heart-fall{
  0%{opacity:0;transform:translate3d(0,0,0) rotate(var(--tilt))}
  10%,80%{opacity:1}
  100%{opacity:0;transform:translate3d(var(--drift),calc(100vh + 112px),0) rotate(var(--turn))}
}
@keyframes heart-glow{
  0%,100%{opacity:0}
  18%,70%{opacity:1}
}
@media(prefers-reduced-motion:reduce){
  .heart-rain .heart-drop{
    top:var(--rest);
    animation:heart-glow 1100ms ease both!important;
  }
}

</style>
</head>
<body>
<main>
<section id="cover" aria-labelledby="title">
<div class="snow" aria-hidden="true">✦ · ✧</div>
<h1 id="title">현지와 보내고 싶은<br>크리스마스 저녁</h1>
<div id="envelope" class="envelope" aria-hidden="true"><span class="flap"></span><img class="seal" src="./images/wax-seal.webp" width="192" height="192" alt="">
<img id="dried-flower" class="dried-flower" src="./images/pressed-flowers.webp" width="528" height="352" alt="">
</div>
<form id="unlock">
<label for="password">봉인을 풀려면 암호를 입력해 주세요.</label>
<input id="password" type="password" required autocomplete="off" maxlength="256">
<button id="open">봉인 풀기</button>
<p id="unlock-status" class="feedback" role="status"></p>
</form>
</section>
<section id="letter" class="paper" aria-labelledby="greeting" hidden>
<div id="letter-flower" class="letter-flower" aria-hidden="true"></div>
<h2 id="greeting" tabindex="-1"></h2>
<p id="body" class="letter-copy"></p>
<p id="signature"></p>
<button id="show-choices" type="button">데이트 코스 보기</button>
</section>
<section id="choices" aria-labelledby="choice-title" hidden>
<h2 id="choice-title" tabindex="-1">우리의 한남동 저녁</h2>
<div id="itinerary" class="alley-route" aria-label="한남동 데이트 동선">
  <div id="stop-1" class="route-stop">
    <p class="route-label">1차 · 저녁 식사</p>
  </div>
  <button id="alley-letter" class="alley-walk" type="button" aria-label="골목길 사진에서 숨겨진 편지 열기" aria-controls="postscript"></button>
  <div class="alley-next">
    <button id="next-stop" type="button" class="secondary">골목길 따라 2차로</button>
  </div>
  <div id="stop-2" class="route-stop">
    <p class="route-label">2차 · 막창</p>
  </div>
</div>
<div class="itinerary-actions">
  <button id="previous-stop" type="button" class="secondary">1차로 돌아가기</button>
  <button id="back" type="button" class="secondary">편지 다시 읽기</button>
</div>
<template id="stop-template">
  <article class="itinerary-stop">
    <figure class="itinerary-image"><img alt=""></figure>
    <div class="itinerary-info">
      <h3 class="itinerary-name" tabindex="-1"></h3>
      <address class="itinerary-address"></address>
      <p class="itinerary-description"></p>
      <a class="itinerary-map" target="_blank" rel="noopener noreferrer">네이버 지도 열기</a>
      <a class="itinerary-credit" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </article>
</template>
</section>
<section id="postscript" aria-labelledby="postscript-title" hidden>
  <article class="postscript-paper">
    <h2 id="postscript-title" tabindex="-1">숨겨진 편지</h2>
    <p id="postscript-body" class="letter-copy"></p>
  </article>
  <button id="back-to-alley" type="button" class="secondary">골목길로 돌아가기</button>
</section>
</main>
<div id="heart-rain" class="heart-rain" aria-hidden="true"></div>

<script>
const get = id => document.getElementById(id);
const decode = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
const sealed = JSON.parse(get('sealed-data').textContent);

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

function show(id, heading, animate = true) {
  for (const panel of ['cover', 'letter', 'choices', 'postscript']) {
    const element = get(panel);
    element.hidden = panel !== id;
    element.classList.toggle('panel-in', panel === id && animate && !reducedMotion.matches);
  }
  get(heading).focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

async function unsealLetter() {
  const envelope = get('envelope');
  const flower = get('dried-flower');
  const reveal = animate => {
    get('letter-flower').append(flower);
    show('letter', 'greeting', animate);
  };

  envelope.classList.add('unsealed');
  if (reducedMotion.matches) {
    reveal(false);
    return;
  }

  await Promise.allSettled((envelope.getAnimations?.({ subtree: true }) ?? []).map(animation => animation.finished));

  if (document.startViewTransition && !reducedMotion.matches) {
    const root = document.documentElement;
    root.classList.add('opening');
    try {
      await document.startViewTransition(() => reveal(false)).finished;
    } finally {
      root.classList.remove('opening');
    }
    return;
  }

  reveal(true);
}

const heartColors = ['❤️', '🩷', '🧡', '💛', '💚', '🩵', '💙', '💜', '🤎', '🖤', '🩶', '🤍'];
const heartPattern = /((?:[❤♥]\uFE0F?|[🩷🧡💛💚🩵💙💜🤎🖤🩶🤍💕💞💓💗💖💝💘])+)/gu;

function showerHearts() {
  const rain = get('heart-rain');
  const count = heartColors.length * (reducedMotion.matches ? 1 : 3);
  const hearts = Array.from({ length: count }, (_, index) => {
    const heart = document.createElement('span');
    heart.className = 'heart-drop';
    heart.textContent = heartColors[index % heartColors.length];
    heart.style.setProperty('--left', (2 + (index + Math.random()) / count * 94) + '%');
    heart.style.setProperty('--rest', (12 + Math.random() * 70) + '%');
    heart.style.setProperty('--size', (15 + Math.random() * 17) + 'px');
    heart.style.setProperty('--duration', (1900 + Math.random() * 870) + 'ms');
    heart.style.setProperty('--delay', (Math.random() * 680) + 'ms');
    heart.style.setProperty('--drift', ((Math.random() - .5) * 90) + 'px');
    heart.style.setProperty('--tilt', ((Math.random() - .5) * 65) + 'deg');
    heart.style.setProperty('--turn', ((Math.random() - .5) * 140) + 'deg');
    heart.addEventListener('animationend', () => heart.remove(), { once: true });
    return heart;
  });
  rain.replaceChildren(...hearts);
}

function fillLetterBody(id, text) {
  get(id).replaceChildren(...text.split(heartPattern).map((part, index) => {
    if (index % 2 === 0) return document.createTextNode(part);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'heart-button';
    button.textContent = part;
    button.setAttribute('aria-label', '하트 비 내리기 ' + part);
    button.addEventListener('click', showerHearts);
    return button;
  }));
}

function fillInvitation(invitation) {
  get('greeting').textContent = invitation.greeting;
  fillLetterBody('body', invitation.body);
  fillLetterBody('postscript-body', invitation.postscript ?? '');
  get('alley-letter').hidden = !invitation.postscript;
  get('signature').textContent = invitation.signature;
  invitation.venues.forEach((venue, index) => {
    const stop = get('stop-template').content.firstElementChild.cloneNode(true);
    const location = get('stop-' + (index + 1));
    const name = stop.querySelector('.itinerary-name');
    name.id = location.id + '-name';
    name.textContent = venue.name;
    stop.setAttribute('aria-labelledby', name.id);
    stop.querySelector('.itinerary-address').textContent = venue.address;
    stop.querySelector('.itinerary-description').textContent = venue.description;
    stop.querySelector('.itinerary-map').href = venue.naverMap;
    const image = stop.querySelector('img');
    image.alt = venue.photoAlt;
    const credit = stop.querySelector('.itinerary-credit');
    credit.href = venue.photoSource;
    credit.textContent = '사진 · ' + venue.photoSourceName;
    image.addEventListener('error', () => {
      image.closest('figure').hidden = true;
      credit.hidden = true;
    }, { once: true });
    image.src = venue.photo;
    location.append(stop);
  });
}

function walkTo(stopId) {
  const stop = get(stopId);
  stop.querySelector('.itinerary-name').focus({ preventScroll: true });
  stop.scrollIntoView({ block: 'start', behavior: reducedMotion.matches ? 'auto' : 'smooth' });
}

get('unlock').addEventListener('submit', async event => {
  event.preventDefault();
  const password = get('password');
  const button = get('open');
  const status = get('unlock-status');
  if (!globalThis.crypto?.subtle) {
    status.textContent = 'HTTPS 링크를 브라우저에서 열어 주세요.';
    return;
  }
  status.textContent = '';
  button.disabled = true;
  let invitation;
  try {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({
      name: 'PBKDF2', salt: decode(sealed.salt), iterations: sealed.iterations, hash: 'SHA-256'
    }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode(sealed.iv) }, key, decode(sealed.ciphertext));
    invitation = JSON.parse(new TextDecoder().decode(plaintext));
  } catch {
    status.textContent = '암호를 다시 확인해 주세요.';
    button.disabled = false;
    password.select();
    password.focus();
    return;
  }
  password.value = '';
  fillInvitation(invitation);
  await unsealLetter();
});

get('show-choices').addEventListener('click', () => show('choices', 'choice-title'));
get('back').addEventListener('click', () => show('letter', 'greeting'));
get('next-stop').addEventListener('click', () => walkTo('stop-2'));
get('alley-letter').addEventListener('click', () => show('postscript', 'postscript-title', false));
get('back-to-alley').addEventListener('click', () => {
  show('choices', 'alley-letter', false);
  get('alley-letter').scrollIntoView({ block: 'center' });
});
get('previous-stop').addEventListener('click', () => walkTo('stop-1'));
</script>
