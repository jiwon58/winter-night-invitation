<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta property="og:title" content="겨울밤 초대장">
<meta property="og:description" content="너와 보내고 싶은 크리스마스 저녁">
<title>겨울밤 초대장</title>
<style>
:root{
  color-scheme:dark;
  --ink:#f7eedf;
  --gold:#e9c993;
  --settle:cubic-bezier(.22,1,.36,1);
  --panel-radius:24px;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100svh;
  padding:clamp(16px,4vw,32px);
  display:grid;
  place-items:center;
  background:radial-gradient(ellipse at 50% 0%,#242c47 0%,transparent 63%),
    radial-gradient(ellipse at 35% 95%,#272133 0%,transparent 55%),#0d1324;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
main{width:min(100%,540px);min-width:0}
section{
  padding:clamp(22px,6vw,52px);
  border:1px solid #baa17a3d;
  border-radius:var(--panel-radius);
  background:linear-gradient(155deg,#1f2841,#171d32);
  box-shadow:0 24px 64px #04071366,inset 0 1px #ffffff09;
}
#cover{
  text-align:center;
  background:radial-gradient(ellipse at 50% 44%,#3a3248,transparent 72%),linear-gradient(155deg,#222a43,#171d32);
}
h1,h2{font-family:'Noto Serif KR','Nanum Myeongjo',Georgia,serif;word-break:keep-all;line-height:1.45;font-weight:500;margin:10px 0 24px}
h1{font-size:clamp(27px,6vw,43px);letter-spacing:-.025em}
p{line-height:1.8}
.snow{color:var(--gold);letter-spacing:.55em;font-size:.9rem}
.envelope{
  position:relative;
  margin:38px auto 32px;
  width:min(228px,100%);
  height:138px;
  perspective:600px;
  background:linear-gradient(#424d70,#333c59);
  border:1px solid #dcc49e66;
  border-radius:7px;
  box-shadow:0 12px 30px #080a1973;
}
.envelope::before,.flap{
  position:absolute;
  inset:0;
  content:"";
  background:linear-gradient(155deg,#343e5d,#2a334e);
  clip-path:polygon(0 0,50% 61%,100% 0,100% 100%,0 100%);
  border-radius:inherit;
}
.flap{
  background:linear-gradient(155deg,#53607f,#3b4566 75%);
  clip-path:polygon(0 0,100% 0,50% 64%);
  transform-origin:top;
}
.seal{
  position:absolute;
  top:60%;
  left:50%;
  transform:translate(-50%,-50%);
  width:49px;
  aspect-ratio:1;
  border-radius:48% 52% 47% 53%;
  border:1px solid #ca8480;
  background:radial-gradient(at 37% 28%,#b96569,#792f46 75%);
  box-shadow:inset 0 0 0 3px #68263c4f,0 5px 10px #06091273;
}
.dried-flower{position:relative;display:block;width:153px;height:auto;pointer-events:none;z-index:1}
.envelope .dried-flower{
  position:absolute;
  width:141px;
  top:60%;
  left:50%;
  transform:translate(-92%,-91%);
  filter:drop-shadow(0 3px 3px #10091172);
}
.letter-flower{margin:-9px auto 4px;width:max-content}
.letter-flower .dried-flower{filter:drop-shadow(0 2px 2px #6c493428)}
.unsealed .seal{animation:release 320ms var(--settle) both}
.unsealed .flap{animation:unfold 350ms var(--settle) both}
@keyframes release{
  to{transform:translate(-35%,-18%) rotate(12deg) scale(.87);opacity:0}
}
@keyframes unfold{
  to{transform:rotateX(29deg);opacity:.72}
}
.opening .dried-flower{view-transition-name:pressed-flower}
::view-transition{pointer-events:none}
html.opening::view-transition-old(root){animation:fade-out 245ms ease-out both}
html.opening::view-transition-new(root){animation:fade-in 420ms var(--settle) both}
html.opening::view-transition-group(pressed-flower){animation-duration:520ms;animation-timing-function:var(--settle)}
html.opening::view-transition-old(pressed-flower){animation:fade-out 420ms var(--settle) both}
html.opening::view-transition-new(pressed-flower){animation:fade-in 420ms var(--settle) both}
@keyframes fade-out{to{opacity:0}}
@keyframes fade-in{from{opacity:0}}
@keyframes panel-in{from{opacity:0;transform:translateY(8px)}}
.panel-in{animation:panel-in 330ms var(--settle) both}
form{display:grid;gap:10px}
input,button,textarea{font:inherit}
input[type=password],textarea{
  width:100%;
  border:1px solid #e9c9934a;
  border-radius:12px;
  background:#10172a9e;
  color:var(--ink);
  padding:12px;
  text-align:center;
}
input[type=password]:focus,textarea:focus{outline:2px solid #e9c9939c;outline-offset:2px}
button{
  min-height:46px;
  border:0;
  border-radius:12px;
  padding:10px 16px;
  background:linear-gradient(#efd5ac,#e4bc82);
  color:#261b16;
  font-weight:650;
  cursor:pointer;
  transition:opacity 150ms ease,transform 180ms var(--settle);
}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.55;cursor:default}
button.secondary{background:transparent;border:1px solid #e9c9934a;color:var(--ink);margin-top:12px}
[hidden]{display:none!important}
.feedback{margin:0;color:#ffd4b5}
.paper{background:linear-gradient(155deg,#fff9ed,#f6ead7);border-color:#fff4e4;color:#322824;color-scheme:light}
#body{white-space:pre-wrap;overflow-wrap:anywhere}
#signature{text-align:right;white-space:pre-wrap}
.venue{background:#263049;border:1px solid #ead3aa40;border-radius:14px;overflow:hidden;transition:background-color 180ms ease,border-color 180ms ease}
.venue:has(input:checked){border-color:var(--gold);background:#33304a}
.venue summary{display:flex;align-items:center;gap:10px;min-height:52px;padding:12px 14px;cursor:pointer;list-style:none}
.venue-thumb{width:clamp(64px,19vw,96px);height:64px;object-fit:cover;border-radius:4px;flex:none}
.venue-heading small{display:block;margin-top:2px;color:#e7d8bf;font-size:.8rem}
.venue summary::-webkit-details-marker{display:none}
.venue summary::after{content:"";flex:none;border:solid var(--gold);border-width:0 2px 2px 0;width:7px;height:7px;transform:rotate(45deg);margin-left:auto;margin-right:3px}
.venue[open] summary::after{transform:rotate(225deg)}
.venue summary:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}
.venue .selected{display:none;color:var(--gold);font-size:.78rem}
.venue:has(input:checked) .selected{display:inline}
.venue-info{padding:0 14px 14px}
.venue-photo{margin:0}
.venue-photo img{display:block;width:100%;height:clamp(180px,52vw,295px);object-fit:cover;border-radius:9px}
.venue-photo figcaption{margin-top:6px;font-size:.76rem}
.venue-photo a{color:#e7d8bf;text-underline-offset:3px}
.venue-info p{margin:12px 0}
.venue-review{border-left:2px solid var(--gold);padding-left:10px;color:#f5e3bf}
.venue-maps{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.venue-maps a{display:inline-flex;align-items:center;min-height:44px;padding:6px 12px;border:1px solid #978260;border-radius:4px;color:var(--ink);text-underline-offset:3px}
.venue-select{display:flex;align-items:center;gap:9px;min-height:44px;cursor:pointer}
.venue-select input{accent-color:var(--gold)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<section id="cover" aria-labelledby="title">
<div class="snow" aria-hidden="true">✦ · ✧</div>
<h1 id="title">너와 보내고 싶은<br>크리스마스 저녁</h1>
<div id="envelope" class="envelope" aria-hidden="true"><span class="flap"></span><span class="seal"></span>
<img id="dried-flower" class="dried-flower" src="./images/pressed-flowers.webp" width="528" height="352" alt="">
</div>
<form id="unlock">
<label for="password">봉인을 풀 암호를 입력해 줘</label>
<input id="password" type="password" required autocomplete="off" maxlength="256">
<button id="open">봉인 풀기</button>
<p id="unlock-status" class="feedback" role="status"></p>
</form>
</section>
<section id="letter" class="paper" aria-labelledby="greeting" hidden>
<div id="letter-flower" class="letter-flower" aria-hidden="true"></div>
<h2 id="greeting" tabindex="-1"></h2>
<p id="body"></p>
<p id="signature"></p>
<button id="show-choices" type="button">저녁 초대장 보기</button>
</section>
<section id="choices" aria-labelledby="choice-title" hidden>
<h2 id="choice-title" tabindex="-1">어떤 저녁을 함께 보내고 싶으세요?</h2>
<form id="reply">
<div id="venues" style="display:grid;gap:10px"></div>
<button id="copy-reply" disabled>답장 복사하기</button>
<textarea id="reply-text" aria-label="카톡 답장" readonly hidden></textarea>
<p id="reply-status" class="feedback" role="status"></p>
</form>
<button id="back" type="button" class="secondary">편지 다시 읽기</button>
</section>
</main>

<script>
const get = id => document.getElementById(id);
const decode = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
const sealed = JSON.parse(get('sealed-data').textContent);

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

function show(id, heading, animate = true) {
  for (const panel of ['cover', 'letter', 'choices']) {
    const element = get(panel);
    element.hidden = panel !== id;
    element.classList.toggle('panel-in', panel === id && animate && !reducedMotion.matches);
  }
  get(heading).focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

async function unsealLetter() {
  const envelope = get('envelope');
  const flower = get('dried-flower');
  const reveal = animate => {
    get('letter-flower').append(flower);
    show('letter', 'greeting', animate);
  };

  envelope.classList.add('unsealed');
  if (reducedMotion.matches) {
    reveal(false);
    return;
  }

  await Promise.allSettled((envelope.getAnimations?.({ subtree: true }) ?? []).map(animation => animation.finished));

  if (document.startViewTransition && !reducedMotion.matches) {
    const root = document.documentElement;
    root.classList.add('opening');
    try {
      await document.startViewTransition(() => reveal(false)).finished;
    } finally {
      root.classList.remove('opening');
    }
    return;
  }

  reveal(true);
}

function fillInvitation(invitation) {
  get('greeting').textContent = invitation.greeting;
  get('body').textContent = invitation.body;
  get('signature').textContent = invitation.signature;
  get('venues').replaceChildren(...invitation.venues.map(venue => {
    const card = document.createElement('details');
    card.className = 'venue';
    card.name = 'venue-details';

    const heading = document.createElement('summary');
    const name = document.createElement('strong');
    name.textContent = venue.name;
    const selected = document.createElement('span');
    selected.className = 'selected';
    selected.textContent = '선택됨';
    const title = document.createElement('div');
    title.className = 'venue-heading';
    title.append(name);
    if (venue.neighborhood) {
      const neighborhood = document.createElement('small');
      neighborhood.textContent = venue.neighborhood;
      title.append(neighborhood);
    }
    heading.append(title, selected);

    const info = document.createElement('div');
    info.className = 'venue-info';
    if (venue.photo) {
      const thumbnail = document.createElement('img');
      thumbnail.className = 'venue-thumb';
      thumbnail.alt = '';
      thumbnail.decoding = 'async';
      thumbnail.addEventListener('error', () => thumbnail.remove(), { once: true });
      thumbnail.src = venue.photo;
      heading.prepend(thumbnail);

      const photo = document.createElement('figure');
      photo.className = 'venue-photo';
      const image = document.createElement('img');
      image.alt = venue.photoAlt || venue.name + ' 실내';
      image.loading = 'lazy';
      image.decoding = 'async';
      image.addEventListener('error', () => photo.remove(), { once: true });
      image.src = venue.photo;
      photo.append(image);

      if (venue.photoSourceName && venue.photoSource?.startsWith('https://')) {
        const caption = document.createElement('figcaption');
        const source = document.createElement('a');
        source.href = venue.photoSource;
        source.target = '_blank';
        source.rel = 'noopener noreferrer';
        source.textContent = '사진 · ' + venue.photoSourceName;
        caption.append(source);
        photo.append(caption);
      }
      info.append(photo);
    }

    const description = document.createElement('p');
    description.textContent = venue.description;
    info.append(description);
    if (venue.review) {
      const review = document.createElement('p');
      review.className = 'venue-review';
      review.textContent = venue.review;
      info.append(review);
    }

    const maps = document.createElement('div');
    maps.className = 'venue-maps';
    for (const [label, link] of [['네이버 지도', venue.naverMap], ['카카오맵', venue.kakaoMap]]) {
      if (!link?.startsWith('https://')) continue;
      const anchor = document.createElement('a');
      anchor.href = link;
      anchor.target = '_blank';
      anchor.rel = 'noopener noreferrer';
      anchor.textContent = label;
      maps.append(anchor);
    }
    if (maps.childElementCount) info.append(maps);

    const label = document.createElement('label');
    label.className = 'venue-select';
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'venue';
    input.value = venue.name;
    input.required = true;
    label.append(input, '여기로 갈래요');
    info.append(label);
    card.append(heading, info);
    return card;
  }));
}

get('unlock').addEventListener('submit', async event => {
  event.preventDefault();
  const password = get('password');
  const button = get('open');
  const status = get('unlock-status');
  if (!globalThis.crypto?.subtle) {
    status.textContent = 'HTTPS 링크를 브라우저에서 열어 줘.';
    return;
  }
  status.textContent = '';
  button.disabled = true;
  let invitation;
  try {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({
      name: 'PBKDF2', salt: decode(sealed.salt), iterations: sealed.iterations, hash: 'SHA-256'
    }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode(sealed.iv) }, key, decode(sealed.ciphertext));
    invitation = JSON.parse(new TextDecoder().decode(plaintext));
  } catch {
    status.textContent = '암호를 다시 확인해 줘.';
    button.disabled = false;
    password.select();
    password.focus();
    return;
  }
  password.value = '';
  fillInvitation(invitation);
  await unsealLetter();
});

get('show-choices').addEventListener('click', () => show('choices', 'choice-title'));
get('back').addEventListener('click', () => show('letter', 'greeting'));
get('venues').addEventListener('change', () => {
  get('copy-reply').disabled = false;
  get('reply-text').hidden = true;
  get('reply-status').textContent = '';
});
get('reply').addEventListener('submit', async event => {
  event.preventDefault();
  const value = new FormData(event.currentTarget).get('venue');
  const text = '크리스마스 데이트는 ‘' + value + '’에 가고 싶어요!';
  const fallback = get('reply-text');
  try {
    await navigator.clipboard.writeText(text);
    fallback.hidden = true;
    get('reply-status').textContent = '답장을 복사했어요. 카톡에 붙여넣어 보내 주세요.';
  } catch {
    fallback.value = text;
    fallback.hidden = false;
    fallback.select();
    get('reply-status').textContent = '선택한 답장을 복사해 카톡으로 보내 주세요.';
  }
});
</script>
